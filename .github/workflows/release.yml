name: Release

# Builds the Minecraft 26.1 and 26.2 jars and publishes them to a GitHub Release.
# Trigger by pushing a version tag, e.g.:
#   git tag v1.2.0
#   git push origin v1.2.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build both Minecraft versions
        run: ./gradlew :26.1:build :26.2:build --stacktrace

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            versions/26.1/build/libs/Skyziyou-Fabric+mc26.1-*.jar
            versions/26.2/build/libs/Skyziyou-Fabric+mc26.2-*.jar
          generate_release_notes: true
